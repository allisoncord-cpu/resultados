<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resultados ao vivo</title>
<meta name="description" content="Resultados de uma conta real de forex, atualizados automaticamente.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{ --bg:#070707; --card:#121212; --ink:#f4f4f4; --ink-2:#9a9a9a; --line:#232323; --bom:#22c55e; --ruim:#ef4444; --verde:#22c55e; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Montserrat,system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
.topo{position:relative;overflow:hidden;background:radial-gradient(900px 380px at 50% -10%,rgba(34,197,94,.16),transparent 70%),var(--bg)}
.topo:before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(#000,transparent 90%);opacity:.55}
main{position:relative;max-width:620px;margin:0 auto;padding:40px 18px 48px}
header{text-align:center;margin-bottom:26px}
.vivo{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:rgba(255,255,255,.03);padding:7px 14px;border-radius:999px;font-size:12px;font-weight:600;color:var(--ink-2)}
.vivo i{width:8px;height:8px;border-radius:50%;background:var(--bom);box-shadow:0 0 0 4px rgba(34,197,94,.2)}
.vivo.parado i{background:var(--ink-2);box-shadow:none}
h1{font-size:clamp(30px,6.5vw,44px);font-weight:900;letter-spacing:-.03em;line-height:1.05;margin:18px 0 8px}
h1 em{font-style:normal;color:var(--verde)}
.sub{color:var(--ink-2);font-size:15px;margin:0}
.assina{display:inline-flex;align-items:center;gap:10px;margin-top:18px;color:var(--ink-2);font-size:13px;text-align:left}
.assina b{color:var(--ink);display:block;font-size:14px}
.av{width:44px;height:44px;border-radius:50%;border:2px solid var(--verde);object-fit:cover;filter:grayscale(1)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:12px}
.destaque{text-align:center;background:linear-gradient(180deg,rgba(34,197,94,.08),transparent 70%),var(--card)}
.destaque .rot{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2);font-weight:700}
.destaque .num{font-size:clamp(52px,12vw,72px);font-weight:900;letter-spacing:-.03em;line-height:1.05;margin:8px 0;font-variant-numeric:tabular-nums}
.destaque .det{font-size:13px;color:var(--ink-2)}
.pos{color:var(--bom)} .neg{color:var(--ruim)}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.kpi .rot{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);font-weight:700}
.kpi .val{font-size:26px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .det{font-size:12px;color:var(--ink-2)}
h2{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--verde);margin:0 0 14px;font-weight:700}
svg{display:block;width:100%;height:auto}
.eixo{fill:var(--ink-2);font-size:15px;font-family:inherit}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:10px 0;border-top:1px solid var(--line)}
td.n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.botoes{display:grid;gap:10px;margin:20px 0}
.btn{display:block;text-align:center;text-decoration:none;font-weight:800;padding:16px;border-radius:12px;font-size:15px;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn.prim{background:var(--verde);color:#04170b}
.btn.sec{border:1px solid #333;color:var(--ink)}
.zap{border-color:rgba(37,211,102,.35);background:linear-gradient(180deg,rgba(37,211,102,.08),transparent 70%),var(--card)}
.zap h2{color:#25d366}
.zap-txt{font-size:15px;margin:0 0 14px}
.btn.zapbtn{background:#25d366;color:#04170b}
.passos{margin:6px 0 14px;padding-left:20px;display:grid;gap:10px;font-size:15px;line-height:1.45;color:var(--ink)}
.taxas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.taxas div{border:1px solid var(--line);border-radius:12px;padding:12px}
.taxas b{display:block;font-size:26px;color:var(--verde)}
.taxas span{font-size:13px;color:var(--ink-2)}
.nota{font-size:13px;color:var(--ink-2);margin:12px 0 0}
.embreve{text-align:center;font-size:13px;color:var(--ink-2);border:1px dashed var(--line);border-radius:14px;padding:12px}
.aviso{font-size:12px;color:#d6b4b4;background:#140a0a;border:1px solid #3a1b1b;border-radius:14px;padding:14px;margin-top:22px;line-height:1.6}
.vazio{text-align:center;color:var(--ink-2);font-size:14px;padding:20px 0}
footer{text-align:center;color:var(--ink-2);font-size:12px;margin-top:22px}
</style>
</head>
<body>
<div class="topo"><main id="app"></main></div>
<script src="config.js"></script>
<script src="resultados.js"></script>
<script>
(function(){
  const C = window.CONFIG || {}, R = window.RESULTADOS;
  const fmt = (v, casas=2) => (v>0?"+":"") + v.toLocaleString("pt-BR",{minimumFractionDigits:casas,maximumFractionDigits:casas}) + "%";
  const cls = v => v>0 ? "pos" : v<0 ? "neg" : "";
  const dataBR = s => new Date(s*1000).toLocaleDateString("pt-BR",{timeZone:"America/Sao_Paulo"});
  const nomeMes = m => { const [a,b]=m.split("-"); return new Date(+a,+b-1,15).toLocaleDateString("pt-BR",{month:"long",year:"numeric"}); };
  const esc = s => String(s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const link = u => /^https:\/\//.test(u||"") ? esc(u) : "";

  let h = `<header>`;
  if(R){
    const min = Math.round((Date.now()/1000 - R.atualizado_em)/60);
    const parado = min > 90;
    const quando = min < 2 ? "agora" : min < 60 ? `há ${min} min` : `há ${Math.round(min/60)} h`;
    h += `<div class="vivo ${parado?"parado":""}"><i></i>${parado ? "Atualizado " + quando : "Ao vivo · atualizado " + quando}</div>`;
  }
  h += `<h1>Resultados <em>ao vivo</em></h1><p class="sub">${esc(C.subtitulo||"")}</p><div class="assina"><img class="av" src="allison.png" alt="Allison"><div><b>Allison · Legatus</b>Conta real verificada · @legatusgroupfx</div></div></header>`;

  if(!R || !R.inicio){
    h += `<div class="card vazio">Os resultados aparecem aqui assim que a conta começar a operar.</div>`;
  } else {
    h += `<div class="card destaque"><div class="rot">Rentabilidade desde o início</div>
      <div class="num ${cls(R.crescimento)}">${fmt(R.crescimento)}</div>
      <div class="det">desde ${dataBR(R.inicio)} · ${R.dias} dia(s) · depósitos não contam como lucro</div></div>`;
    h += `<div class="grade">
      <div class="kpi"><div class="rot">Este mês</div><div class="val ${cls(R.mes_atual)}">${fmt(R.mes_atual)}</div><div class="det">operações fechadas</div></div>
      <div class="kpi"><div class="rot">Pior rebaixamento</div><div class="val">${R.pior_rebaixamento.toLocaleString("pt-BR",{maximumFractionDigits:1})}%</div><div class="det">maior queda temporária</div></div>
      <div class="kpi"><div class="rot">Operações fechadas</div><div class="val">${R.operacoes_fechadas}</div><div class="det">${R.acerto!==null ? R.acerto.toLocaleString("pt-BR") + "% com lucro" : "nenhuma fechada ainda"}</div></div>
      <div class="kpi"><div class="rot">Abertas agora</div><div class="val">${R.abertas_agora}</div><div class="det">${R.abertas_agora ? "flutuante " + fmt(R.flutuante_agora) : "nenhuma em aberto"}</div></div>
    </div>`;
    h += `<div class="card"><h2>Crescimento da conta</h2>${grafico(R.curva)}</div>`;
    if(R.meses.length){
      h += `<div class="card"><h2>Mês a mês</h2><table>` +
        R.meses.slice().reverse().map(x=>`<tr><td>${nomeMes(x.m)}</td><td class="n ${cls(x.r)}">${fmt(x.r)}</td></tr>`).join("") + `</table></div>`;
    }
  }

  h += `<div class="card zap"><h2>Resumo da semana no WhatsApp</h2>
    <p class="zap-txt">Todo sábado eu mando no grupo o resumo da conta real: operações da semana, resultado do mês e do ano. Grátis, e só eu posto no grupo, sem bagunça.</p>
    <a class="btn zapbtn" href="https://chat.whatsapp.com/IlZBVR45fd42ztf4DkR9wu" target="_blank" rel="noopener">Receber o resumo no WhatsApp</a></div>`;
  h += `<div class="botoes">`;
  if(link(C.myfxbook)) h += `<a class="btn sec" href="${link(C.myfxbook)}" target="_blank" rel="noopener">Ver resultado verificado no Myfxbook</a>`;
  h += `<a class="btn prim" href="https://chat.whatsapp.com/IlZBVR45fd42ztf4DkR9wu" target="_blank" rel="noopener">Grupo no WhatsApp: resumo semanal e dúvidas</a>`;
  h += `<a class="btn sec" href="swing.html">Por que swing trade</a>`;
  h += `</div>`;
  h += `<p class="aviso">Percentuais calculados sobre as operações fechadas, sem contar depósitos e saques. Resultados passados não garantem resultados futuros. Operar forex envolve alto risco e pode causar perda do capital. Não é recomendação de investimento.</p>`;
  h += `<footer>@legatusgroupfx · Legatus Group</footer>`;
  document.getElementById("app").innerHTML = h;

  function grafico(c){
    if(!c || c.length < 2) return `<div class="vazio">O gráfico começa a aparecer depois da primeira operação fechada.</div>`;
    const W=520, H=230, pe=64, pd=10, pt=14, pb=30;
    const t0=c[0].t, t1=c[c.length-1].t || t0+1;
    let lo=Math.min(0,...c.map(p=>p.g)), hi=Math.max(0,...c.map(p=>p.g));
    if(hi-lo < 1){ hi += .5; lo -= .5; }
    const x = t => pe + (t-t0)/Math.max(1,t1-t0)*(W-pe-pd);
    const y = g => pt + (hi-g)/(hi-lo)*(H-pt-pb);
    let d = "";
    c.forEach((p,i)=>{ d += (i? " L":"M") + x(p.t).toFixed(1) + " " + y(i? c[i-1].g : p.g).toFixed(1); if(i) d += " L" + x(p.t).toFixed(1) + " " + y(p.g).toFixed(1); });
    const ult = c[c.length-1].g, cor = ult>=0 ? "var(--bom)" : "var(--ruim)";
    const area = d + ` L${x(t1).toFixed(1)} ${y(0).toFixed(1)} L${x(t0).toFixed(1)} ${y(0).toFixed(1)} Z`;
    const marcas = [hi, (hi+lo)/2, lo].map(g=>`<text class="eixo" x="${pe-6}" y="${y(g)+3}" text-anchor="end">${g.toLocaleString("pt-BR",{maximumFractionDigits:1})}%</text>`).join("");
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Crescimento acumulado: ${fmt(ult)}">
      <line x1="${pe}" x2="${W-pd}" y1="${y(0)}" y2="${y(0)}" stroke="#333" stroke-width="1"/>
      <path d="${area}" fill="${cor}" opacity=".16"/>
      <path d="${d}" fill="none" stroke="${cor}" stroke-width="2.5" stroke-linejoin="round"/>
      ${marcas}
      <text class="eixo" x="${pe}" y="${H-6}">${dataBR(t0)}</text>
      <text class="eixo" x="${W-pd}" y="${H-6}" text-anchor="end">hoje</text></svg>`;
  }
})();
</script>
</body>
</html>
