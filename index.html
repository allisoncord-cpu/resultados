<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resultados ao vivo</title>
<meta name="description" content="Resultados de uma conta real de forex, atualizados automaticamente.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3fb; --card:#ffffff; --ink:#1c1f5e; --ink-2:#5b5f86; --line:#e4d6f5;
  --roxo:#5e2b8c; --laranja:#ff6b1f; --bom:#1f8a5b; --ruim:#c0392b;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1133; --card:#181b45; --ink:#f3effa; --ink-2:#a9abd0; --line:#2c2f63;
    --roxo:#b48be0; --laranja:#ff8a4a; --bom:#4cc38a; --ruim:#ff7a6b;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1133; --card:#181b45; --ink:#f3effa; --ink-2:#a9abd0; --line:#2c2f63;
  --roxo:#b48be0; --laranja:#ff8a4a; --bom:#4cc38a; --ruim:#ff7a6b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Montserrat,system-ui,sans-serif;line-height:1.45}
main{max-width:560px;margin:0 auto;padding:28px 16px 40px}
header{text-align:center;margin-bottom:20px}
.vivo{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.vivo i{width:8px;height:8px;border-radius:50%;background:var(--bom);box-shadow:0 0 0 4px color-mix(in srgb,var(--bom) 25%,transparent)}
.vivo.parado i{background:var(--ink-2);box-shadow:none}
h1{font-size:26px;font-weight:800;margin:8px 0 2px}
.sub{color:var(--ink-2);font-size:14px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:14px}
.destaque{text-align:center}
.destaque .rot{font-size:13px;color:var(--ink-2);font-weight:600}
.destaque .num{font-size:52px;font-weight:800;line-height:1.1;margin:4px 0;font-variant-numeric:tabular-nums}
.destaque .det{font-size:13px;color:var(--ink-2)}
.pos{color:var(--bom)} .neg{color:var(--ruim)}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi .rot{font-size:12px;color:var(--ink-2);font-weight:600}
.kpi .val{font-size:22px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .det{font-size:11px;color:var(--ink-2)}
h2{font-size:15px;margin:0 0 10px}
svg{display:block;width:100%;height:auto}
.eixo{fill:var(--ink-2);font-size:17px;font-family:inherit}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:8px 0;border-top:1px solid var(--line)}
td.n{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.botoes{display:grid;gap:10px;margin:18px 0}
.btn{display:block;text-align:center;text-decoration:none;font-weight:800;padding:15px;border-radius:14px;font-size:15px}
.btn.prim{background:var(--laranja);color:#fff}
.btn.sec{border:2px solid var(--roxo);color:var(--roxo)}
.embreve{text-align:center;font-size:13px;color:var(--ink-2);border:1px dashed var(--line);border-radius:14px;padding:12px}
.aviso{font-size:11px;color:var(--ink-2);text-align:center;margin-top:22px}
.vazio{text-align:center;color:var(--ink-2);font-size:14px;padding:20px 0}
</style>
</head>
<body>
<main id="app"></main>
<script src="config.js"></script>
<script src="resultados.js"></script>
<script>
(function(){
  const C = window.CONFIG || {}, R = window.RESULTADOS;
  const fmt = (v, casas=2) => (v>0?"+":"") + v.toLocaleString("pt-BR",{minimumFractionDigits:casas,maximumFractionDigits:casas}) + "%";
  const cls = v => v>0 ? "pos" : v<0 ? "neg" : "";
  const dataBR = s => new Date(s*1000).toLocaleDateString("pt-BR",{timeZone:"America/Sao_Paulo"});
  const nomeMes = m => { const [a,b]=m.split("-"); return new Date(+a,+b-1,15).toLocaleDateString("pt-BR",{month:"long",year:"numeric"}); };
  const esc = s => String(s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const link = u => /^https:\/\//.test(u||"") ? esc(u) : "";

  let h = `<header>`;
  if(R){
    const min = Math.round((Date.now()/1000 - R.atualizado_em)/60);
    const parado = min > 90;
    const quando = min < 2 ? "agora" : min < 60 ? `há ${min} min` : `há ${Math.round(min/60)} h`;
    h += `<div class="vivo ${parado?"parado":""}"><i></i>${parado ? "Atualizado " + quando : "Ao vivo · atualizado " + quando}</div>`;
  }
  h += `<h1>${esc(C.titulo||"Resultados ao vivo")}</h1><p class="sub">${esc(C.subtitulo||"")}</p></header>`;

  if(!R || !R.inicio){
    h += `<div class="card vazio">Os resultados aparecem aqui assim que a conta começar a operar.</div>`;
  } else {
    h += `<div class="card destaque"><div class="rot">Rentabilidade desde o início</div>
      <div class="num ${cls(R.crescimento)}">${fmt(R.crescimento)}</div>
      <div class="det">desde ${dataBR(R.inicio)} · ${R.dias} dia(s) · depósitos não contam como lucro</div></div>`;
    h += `<div class="grade">
      <div class="kpi"><div class="rot">Este mês</div><div class="val ${cls(R.mes_atual)}">${fmt(R.mes_atual)}</div><div class="det">operações fechadas</div></div>
      <div class="kpi"><div class="rot">Pior rebaixamento</div><div class="val">${R.pior_rebaixamento.toLocaleString("pt-BR",{maximumFractionDigits:1})}%</div><div class="det">maior queda temporária</div></div>
      <div class="kpi"><div class="rot">Operações fechadas</div><div class="val">${R.operacoes_fechadas}</div><div class="det">${R.acerto!==null ? R.acerto.toLocaleString("pt-BR") + "% com lucro" : "nenhuma fechada ainda"}</div></div>
      <div class="kpi"><div class="rot">Abertas agora</div><div class="val">${R.abertas_agora}</div><div class="det">${R.abertas_agora ? "flutuante " + fmt(R.flutuante_agora) : "nenhuma em aberto"}</div></div>
    </div>`;
    h += `<div class="card"><h2>Crescimento da conta</h2>${grafico(R.curva)}</div>`;
    if(R.meses.length){
      h += `<div class="card"><h2>Mês a mês</h2><table>` +
        R.meses.slice().reverse().map(x=>`<tr><td>${nomeMes(x.m)}</td><td class="n ${cls(x.r)}">${fmt(x.r)}</td></tr>`).join("") + `</table></div>`;
    }
  }

  h += `<div class="botoes">`;
  if(link(C.myfxbook)) h += `<a class="btn sec" href="${link(C.myfxbook)}" target="_blank" rel="noopener">Ver resultado verificado no Myfxbook</a>`;
  if(link(C.contato)) h += `<a class="btn prim" href="${link(C.contato)}" target="_blank" rel="noopener">${esc(C.textoContato||"Fale comigo")}</a>`;
  if(C.copyEmBreve) h += `<div class="embreve">Copy trade em breve: você vai poder copiar estas operações automaticamente.</div>`;
  h += `</div>`;
  h += `<p class="aviso">Percentuais calculados sobre as operações fechadas, sem contar depósitos e saques. Resultados passados não garantem resultados futuros. Operar forex envolve alto risco e pode causar perda do capital. Não é recomendação de investimento.</p>`;
  document.getElementById("app").innerHTML = h;

  function grafico(c){
    if(!c || c.length < 2) return `<div class="vazio">O gráfico começa a aparecer depois da primeira operação fechada.</div>`;
    const W=520, H=230, pe=64, pd=10, pt=14, pb=30;
    const t0=c[0].t, t1=c[c.length-1].t || t0+1;
    let lo=Math.min(0,...c.map(p=>p.g)), hi=Math.max(0,...c.map(p=>p.g));
    if(hi-lo < 1){ hi += .5; lo -= .5; }
    const x = t => pe + (t-t0)/Math.max(1,t1-t0)*(W-pe-pd);
    const y = g => pt + (hi-g)/(hi-lo)*(H-pt-pb);
    let d = "";
    c.forEach((p,i)=>{ d += (i? " L":"M") + x(p.t).toFixed(1) + " " + y(i? c[i-1].g : p.g).toFixed(1); if(i) d += " L" + x(p.t).toFixed(1) + " " + y(p.g).toFixed(1); });
    const ult = c[c.length-1].g, cor = ult>=0 ? "var(--bom)" : "var(--ruim)";
    const area = d + ` L${x(t1).toFixed(1)} ${y(0).toFixed(1)} L${x(t0).toFixed(1)} ${y(0).toFixed(1)} Z`;
    const marcas = [hi, (hi+lo)/2, lo].map(g=>`<text class="eixo" x="${pe-6}" y="${y(g)+3}" text-anchor="end">${g.toLocaleString("pt-BR",{maximumFractionDigits:1})}%</text>`).join("");
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Crescimento acumulado: ${fmt(ult)}">
      <line x1="${pe}" x2="${W-pd}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)" stroke-width="1"/>
      <path d="${area}" fill="${cor}" opacity=".12"/>
      <path d="${d}" fill="none" stroke="${cor}" stroke-width="2.5" stroke-linejoin="round"/>
      ${marcas}
      <text class="eixo" x="${pe}" y="${H-6}">${dataBR(t0)}</text>
      <text class="eixo" x="${W-pd}" y="${H-6}" text-anchor="end">hoje</text></svg>`;
  }
})();
</script>
</body>
</html>
